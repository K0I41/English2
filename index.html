<!DOCTYPE html>
<html>
<head>
  <title>健康チェックアプリ</title>
  <meta charset="UTF-8">
</head>
<body>
  <h1>質問に答えると健康状態を評価します</h1>
  <p>質問1<br>今日の睡眠時間</p>
  <form action="#" method="post">
    <input type="radio" name="num_of_inq" value="寝ていない">寝ていない
    <input type="radio" name="num_of_inq" value="3時間以下">3時間以下
    <input type="radio" name="num_of_inq" value="6時間以下">6時間以下
    <input type="radio" name="num_of_inq" value="6~8時間">6~8時間
    <input type="radio" name="num_of_inq" value="8時間以上">8時間以上
  <form>

  <p>質問2<br>今日の運動時間</p>
  <form action="#" method="post">
    <input type="radio" name="num_of_inq" value="全くしていない">全くしていない
    <input type="radio" name="num_of_inq" value="少しだけ">少しだけ
    <input type="radio" name="num_of_inq" value="軽くした">軽くした
    <input type="radio" name="num_of_inq" value="しっかりした">しっかりした
    <input type="radio" name="num_of_inq" value="かなりした">かなりした
  <form>

  <p>質問2<br>朝ごはんは食べた?</p>
  <form action="#" method="post">
    <input type="radio" name="num_of_inq" value="食べていない">食べていない
    <input type="radio" name="num_of_inq" value="食べた">食べた
  <form>

</body>
</html>
